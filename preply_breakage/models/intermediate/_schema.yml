version: 2

models:
  - name: int_payment_cycles
    description: >
      Turns each payment into an explicit 28-day cycle window. Single
      source of truth for cycle boundaries — every other intermediate model
      depends on this one instead of recomputing cycle_start/cycle_end.
      Grain: one row per payment.
    columns:
      - name: payment_id
        description: Primary key. Grain-breaking if not unique — keep at error.
        data_tests: [unique, not_null]
      - name: student_id
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              config:
                severity: warn
              arguments:
                to: ref('stg_students')
                field: student_id
      - name: cycle_start
        description: Same instant as the payment. Inclusive start of the cycle.
      - name: cycle_start_date
        description: >
          cycle_start truncated to a date. Computed once here rather than in
          each downstream model, since both int_lesson_cycles and
          int_cycle_daily_progress need "which calendar day did this cycle
          start" and shouldn't each re-derive cycle_start::date.
      - name: cycle_end_exclusive
        description: cycle_start + 28 days. Exclusive — a booking exactly at this instant belongs to the next cycle.
      - name: cycle_number
        description: 1 for a student's first payment, 2+ for renewals.
      - name: is_renewal
        description: "cycle_number > 1."
      - name: is_closed
        description: >
          Whether cycle_end_exclusive has passed as of as_of_date() (compared
          as dates — see the model's inline comment on why).

  - name: int_lesson_cycles
    description: >
      Maps each lesson to the one cycle it was booked into, via a range-join
      on booking date. This is the model that answers "how do bookings map
      to cycles" — nothing downstream re-derives that mapping.
      Grain: one row per lesson.
    columns:
      - name: lesson_id
        description: >
          Primary key. Unique here also catches a lesson matching more than
          one cycle (would mean overlapping cycle windows for that student,
          a data quality problem this range-join would otherwise mask by
          silently fanning the lesson out into two rows). Grain-breaking —
          keep at error.
        data_tests: [unique, not_null]
      - name: payment_id
        description: >
          Null means the lesson matched no cycle at all (an orphan booking).
          Contained to that one row rather than breaking the model's grain,
          so warn rather than error — but a silent orphan still means that
          lesson's hours never reach any downstream cycle total.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: booked_date
        description: >
          booked_at truncated to a date. Computed once here so
          int_cycle_daily_progress (the only other consumer of booking
          dates) doesn't re-derive its own booked_at::date.

  - name: int_cycle_daily_progress
    description: >
      For every open or closed payment, how many hours it had booked as of
      each day of its cycle — one row per calendar day, not only days with
      activity. Recomputed from full booking history, not stored state.
      Grain: one row per payment x snapshot_date.
    columns:
      - name: payment_snapshot_key
        description: "Surrogate key: payment_id || snapshot_date. Grain-breaking if not unique — keep at error."
        data_tests: [unique, not_null]
      - name: hours_booked_to_date
        description: Cumulative hours booked for this payment, as of snapshot_date.
      - name: day_in_cycle
        description: 0-indexed day offset from cycle_start.

  - name: int_segment_burn_curves
    description: >
      For each (plan_hours, is_renewal) segment and each day of the cycle,
      the average share of the plan already booked by that day — computed
      only from closed cycles. The "prior" the estimation method blends
      with a still-open payment's own actual progress.
      Grain: one row per segment x day_in_cycle.
    columns:
      - name: segment_day_key
        description: "Surrogate key: plan_hours || is_renewal || day_in_cycle. Grain-breaking if not unique — keep at error."
        data_tests: [unique, not_null]
      - name: n_closed_cycles
        description: Sample size behind avg_pct_booked for this segment/day. See the open question on the fallback threshold.
      - name: avg_pct_booked
        description: >
          Population average across n_closed_cycles payments, not a typical
          individual payment's value. At low day_in_cycle this is skewed
          heavily toward 0 — e.g. for the 8h/renewing segment at day 0, 96%
          of payments booked nothing at all and 4% booked something,
          averaging to 0.5%; no individual payment actually books "0.5% of
          a plan." Also note: for a closed cycle, day_in_cycle runs 0 to 28
          inclusive (29 calendar dates), not 0 to 27 — see int_cycle_daily_progress.
