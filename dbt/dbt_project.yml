name: 'preply_breakage'
version: '1.0.0'
config-version: 2

profile: 'preply_breakage'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Point in time the project treats as "today", per the case's instruction
  # to assume today is the last day covered by the dataset. Defaulting to
  # the dataset's own AS_OF_DATE (rather than current_date) is what makes
  # `dbt build` do something meaningful out of the box: with a real
  # current_date, every cycle in this fixed dataset is long closed, so there
  # would be zero open payments and nothing left to estimate — the whole
  # point of the project — and no test would flag it.
  # In production this would be null instead, so each daily run pins itself
  # to the day it runs:
  #   dbt build --vars '{as_of_date: null}'   # => current_date
  #   dbt build --vars '{as_of_date: 2026-01-15}'   # => a backfill
  as_of_date: '2026-04-17'

  # Lookback window for the per-segment booking curves. null => uses the
  # full history of closed cycles (current decision). An integer number of
  # months would bound the window if it's ever needed (product drift,
  # seasonality, ...).
  curve_lookback_months: null

  # Subscription cycle length in days. The one number every cycle/breakage
  # calculation is built on — changing it here is what it'd take to model
  # a 30-day cycle instead of 28 (see the README caveat on what a real
  # length change would still require beyond this).
  cycle_length_days: 28

models:
  preply_breakage:
    staging:
      +materialized: view
      +schema: stg_preply
    intermediate:
      +materialized: table
      +schema: intermediate_preply
    marts:
      +materialized: table
      +schema: marts_preply
